<!DOCTYPE html>
<head>
    <title>Lab Pierre</title>
</head>
<body>
<h1>Page Web jQuery </h1>
 
<label for="vcc">Vcc :</label>
<select id="vcc">
    <option value="24">+24V</option>
    <option value="12">+12V</option>
    <option value="10">+10V</option>
    <option value="5" selected>+5V</option>
    <option value="3.3">+3.3V</option>
</select>
 
<br><br>
 
<label for="rdiv">Rdiv :</label>
<input type="number" id="rdiv" value="10000">
 
<br><br>
 
<label for="vadc">Vadc :</label>
<input type="range" id="vadc" min="0" max="5" step="0.1" value="2.5">
<span id="valeurVadc">2.5</span>
 
<br><br>
 
<label> Units :</label>
<input type="radio" name="unit" value="C" checked> C
<input type="radio" name="unit" value="F"> F
<input type="radio" name="unit" value="K"> K
 
<br><br>
 
<label for="temp">Temp:</label>
<input type="text" id="temp" readonly>
 
<script>
    let vcc = document.getElementById('vcc');
    let rdiv = document.getElementById('rdiv');
    let vadc = document.getElementById('vadc');
    let valeurVadc = document.getElementById('valeurVadc');
    let temp = document.getElementById('temp');
    let units = document.getElementsByName('unit');
 
    function getUnit() {
        for (let i = 0; i < units.length; i++) {
            if (units[i].checked) {
                return units[i].value;
            }
        }
    }
 
    function appelerService() {
        valeurVadc.innerHTML = vadc.value;
 
        let unitChoisie = getUnit();
 
        let url = "conversion.php?Vadc=" + vadc.value
                + "&Vcc=" + vcc.value
                + "&Rdiv=" + rdiv.value
                + "&unit=" + unitChoisie;
 
        let ajax = new XMLHttpRequest();
 
        ajax.open("GET", url, true);
 
        ajax.onreadystatechange = function() {
            if (ajax.readyState === 4 && ajax.status === 200) {
                temp.value = ajax.responseText;
            }
        };
 
        ajax.send();
    }
 
    vcc.addEventListener("change", appelerService);
    rdiv.addEventListener("input", appelerService);
    vadc.addEventListener("input", appelerService);
 
    for (let i = 0; i < units.length; i++) {
        units[i].addEventListener("change", appelerService);
    }
 
    appelerService();
</script>
 
</body>    
</html>
